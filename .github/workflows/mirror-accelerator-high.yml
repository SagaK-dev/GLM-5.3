name: GLM-5.3 mirror accelerator high

on:
  push:
    branches:
      - main
    paths:
      - ".mirror/accelerator-high.trigger"

permissions:
  contents: write

concurrency:
  group: -mirror-accelerator-high-trigger
  cancel-in-progress: true

env:
  MIRROR_REVISION: "935644c05e76fc198714f4cca449fd8b970ff6d7"
  MIRROR_TAG: "upstream-935644c05e76"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned upstream metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$MIRROR_TAG" --pattern "upstream-metadata.json" --dir .
      - name: Build disjoint matrix
        id: matrix
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open("upstream-metadata.json", encoding="utf-8"))
          rows=[]
          for item in data["files"]:
              i=int(item["index"])
              if i == 145 and item["path"] != "LICENSE":
                  rows.append({
                      "index": i,
                      "path": item["path"],
                      "size": "" if item.get("size") is None else str(item["size"]),
                      "sha256": item.get("sha256") or "",
                  })
          print("matrix="+json.dumps(rows,separators=(",",":")))
          PY

  mirror:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade huggingface_hub requests
      - name: Transfer pinned file if not already complete
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ matrix.index }}
          FILE_PATH: ${{ matrix.path }}
          EXPECTED_SIZE: ${{ matrix.size }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        shell: bash
        run: |
          args=(
            --start "$INDEX"
            --end "$INDEX"
            --revision "$MIRROR_REVISION"
            --skip-license
            --path "$FILE_PATH"
          )
          if [[ -n "$EXPECTED_SIZE" ]]; then args+=(--expected-size "$EXPECTED_SIZE"); fi
          if [[ -n "$EXPECTED_SHA256" ]]; then args+=(--expected-sha256 "$EXPECTED_SHA256"); fi
          python scripts/mirror_release_assets.py "${args[@]}"
