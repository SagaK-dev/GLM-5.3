name: Upstream check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata dependency
        run: python -m pip install --upgrade huggingface_hub
      - name: Check official upstream
        run: python scripts/check_upstream.py
